name: PR build for PfNotification

on:
  pull_request:
    branches: [ master ]

permissions:
  contents: read

jobs:

  build:
    runs-on: windows-2022

    steps:
    - name: Checkout
      uses: actions/checkout@v5

    - name: Install .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.0.x

    - name: Download Dalamud
      run: |
        Invoke-WebRequest -Uri https://goatcorp.github.io/dalamud-distrib/latest.zip -OutFile latest.zip
        Expand-Archive -Force latest.zip "$env:AppData\XIVLauncher\addon\Hooks\dev"

    - name: Build with dotnet
      run: dotnet build PfNotification.slnx --configuration Release

    - name: Test
      run: dotnet test tests/PfNotification.Tests --configuration Release --no-build

    - name: Store artifacts
      uses: actions/upload-artifact@v4
      with:
        name: PfNotification
        path: .\PfNotification\bin\x64\Release\PfNotification\*
        if-no-files-found: error
        retention-days: 1
