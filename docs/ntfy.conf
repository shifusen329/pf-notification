# ntfy.shifusenproductions.com -> ntfy container on the Docker host
#
# Lives on the nginx reverse proxy (192.168.0.100). This is the pre-Certbot
# version: `certbot --nginx` adds the 443 listeners, certificate paths and the
# HTTP->HTTPS redirect block, the same way it did for the other sites, so the
# deployed file will end up longer than this one.
#
# Deploy:
#   scp docs/ntfy.conf administrator@192.168.0.100:/tmp/ntfy.conf
#   ssh administrator@192.168.0.100
#   sudo mv /tmp/ntfy.conf /etc/nginx/sites-available/ntfy.conf
#   sudo chown root:root /etc/nginx/sites-available/ntfy.conf
#   sudo ln -s /etc/nginx/sites-available/ntfy.conf /etc/nginx/sites-enabled/ntfy.conf
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx --redirect -d ntfy.shifusenproductions.com
#
# The ntfy server must run with `behind-proxy: true`, otherwise it sees every
# client as this proxy and rate-limits them all as one.

upstream ntfy {
    server 192.168.0.113:8090;
}

server {
    listen 80;
    listen [::]:80;
    server_name ntfy.shifusenproductions.com;

    location / {
        proxy_pass http://ntfy;
        proxy_http_version 1.1;

        # Subscriptions are long-lived streams (JSON, SSE, WebSocket); pass
        # bytes through as they arrive instead of buffering them.
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_redirect off;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # nginx's 60s default would drop idle subscriptions; ntfy sends a
        # keepalive every 45s, well inside this window.
        proxy_connect_timeout 3m;
        proxy_send_timeout 3m;
        proxy_read_timeout 3m;

        # Let ntfy enforce its own attachment size limit.
        client_max_body_size 0;
    }
}
