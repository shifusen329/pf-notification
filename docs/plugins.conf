# plugins.shifusenproductions.com -> private Dalamud plugin repository for PfNotification
#
# Lives on the nginx reverse proxy (192.168.0.100) and serves static files from /var/www/pfnotification. The repo sits
# under an unguessable path segment (RepoPath in tools/publish.ps1); nothing else is served and listings are off.
# Pre-Certbot version, like ntfy.conf: Certbot adds the 443 listeners, certificate paths and the redirect.
#
# Deploy (needs an A record for plugins.shifusenproductions.com first):
#   scp docs/plugins.conf administrator@192.168.0.100:/tmp/plugins.conf
#   ssh administrator@192.168.0.100
#   sudo mv /tmp/plugins.conf /etc/nginx/sites-available/plugins.conf
#   sudo chown root:root /etc/nginx/sites-available/plugins.conf
#   sudo ln -s /etc/nginx/sites-available/plugins.conf /etc/nginx/sites-enabled/plugins.conf
#   sudo install -d -m 755 /var/www/pfnotification
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx --redirect -d plugins.shifusenproductions.com
# Then publish with tools/publish.ps1.

server {
    listen 80;
    listen [::]:80;
    server_name plugins.shifusenproductions.com;

    root /var/www/pfnotification;
    autoindex off;

    # Only the repo index, plugin zips and source archives exist; everything else is a 404.
    # Quoted because nginx would read the regex's {16} as the start of a block.
    location ~ "^/[0-9a-f]{16}/(repo\.json|latest\.zip|source\.zip)$" {
        try_files $uri =404;
        # Dalamud re-reads repo.json on every check; don't let anything in between cache a stale version.
        add_header Cache-Control "no-cache";
    }

    location / {
        return 404;
    }
}
